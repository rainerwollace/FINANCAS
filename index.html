<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Parcelado com Dashboard</title>
<!-- Inclusão do Chart.js para renderização do gráfico -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
background:#eef3f8;
padding:25px;
}

.container{
max-width:950px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#00b894,#00cec9);
color:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
position: relative;
}

.header h1{
margin-bottom:15px;
}

.mes-seletor {
display: flex;
align-items: center;
gap: 15px;
margin-bottom: 20px;
background: rgba(255, 255, 255, 0.2);
padding: 10px 15px;
border-radius: 10px;
width: fit-content;
}

.mes-seletor button {
background: white;
color: #00b894;
border: none;
padding: 5px 12px;
border-radius: 5px;
cursor: pointer;
font-weight: bold;
}

.mes-seletor span {
font-size: 18px;
font-weight: bold;
text-transform: capitalize;
}

.header input{
width:250px;
padding:12px;
font-size:25px;
border:none;
border-radius:10px;
}

.backup-actions {
position: absolute;
top: 25px;
right: 25px;
display: flex;
gap: 10px;
}

.btn-backup {
background: rgba(255, 255, 255, 0.2);
color: white;
border: 1px solid rgba(255, 255, 255, 0.4);
padding: 8px 12px;
border-radius: 8px;
cursor: pointer;
font-size: 14px;
font-weight: 500;
transition: 0.2s;
}

.btn-backup:hover {
background: rgba(255, 255, 255, 0.3);
}

/* Sistema de Abas */
.tabs {
display: flex;
gap: 10px;
margin: 25px 0 5px 0;
}

.tab-btn {
background: white;
border: none;
padding: 12px 24px;
border-radius: 12px;
cursor: pointer;
font-weight: 600;
color: #636e72;
box-shadow: 0 4px 10px rgba(0,0,0,.04);
transition: all 0.2s ease;
font-size: 15px;
}

.tab-btn:hover {
background: #f1f2f6;
color: #2d3436;
}

.tab-btn.active {
background: #00b894;
color: white;
box-shadow: 0 4px 12px rgba(0, 184, 148, 0.3);
}

.tab-content {
display: none;
}

.tab-content.active {
display: block;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
color:#888;
margin-bottom:10px;
font-size: 15px;
}

.valor{
font-size:24px;
font-weight:bold;
}

#saldo, #saldoTotalGeral{
color:#27ae60;
}

#gasto, #gastoTotalGeral{
color:#e74c3c;
}

#pago {
color:#2ecc71;
}

#percentual, #receitaTotalGeral{
color:#3498db;
}

h2{
margin:25px 0 15px;
}

.gasto{
background:white;
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
transition: all 0.2s ease;
border-left: 5px solid transparent;
}

/* Estilo para quando o gasto estiver pago */
.gasto.gasto-pago {
border-left: 5px solid #2ecc71;
background: #f4fbf7;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.nome{
font-size:18px;
font-weight:bold;
padding:8px;
border:none;
border-bottom:2px solid #ddd;
width:50%;
background: transparent;
}

.nome:focus{
outline:none;
border-color:#00b894;
}

.pago-container {
display: flex;
align-items: center;
gap: 6px;
font-weight: 600;
color: #2c3e50;
cursor: pointer;
background: #eee;
padding: 4px 10px;
border-radius: 8px;
font-size: 14px;
user-select: none;
}

.gasto-pago .pago-container {
background: #2ecc71;
color: white;
}

.porcentagem{
font-size:18px;
font-weight:bold;
}

.inputs-gasto {
display: flex;
gap: 10px;
margin: 12px 0;
}

.valorInput{
flex: 2;
padding:12px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
background: white;
}

.vezesInput {
flex: 1;
padding:12px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
text-align: center;
background: white;
}

.barra{
height:18px;
background:#eee;
border-radius:15px;
overflow:hidden;
}

.preenchimento{
height:100%;
width:0%;
transition:.3s;
}

.footer{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
}

.valorTexto{
font-size:22px;
font-weight:bold;
color:#2d3436;
display: flex;
flex-direction: column;
}

.parcela-tag {
font-size: 12px;
color: #7f8c8d;
font-weight: normal;
margin-top: 2px;
}

.excluir{
background:#e74c3c;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

.add{
width:100%;
padding:18px;
margin-top:20px;
font-size:18px;
background:#0984e3;
color:white;
border:none;
border-radius:15px;
cursor:pointer;
}

.add:hover{
background:#0676c8;
}

/* Estilização das Caixas de Busca */
.search-box {
background: white;
padding: 20px;
border-radius: 18px;
box-shadow: 0 5px 15px rgba(0,0,0,.05);
margin-top: 20px;
display: flex;
flex-direction: column;
gap: 8px;
}

.search-box label {
font-weight: 600;
color: #2d3436;
font-size: 15px;
}

.search-box input {
width: 100%;
padding: 12px;
border-radius: 10px;
border: 1px solid #dfe6e9;
font-size: 16px;
outline: none;
transition: border-color 0.2s;
}

.search-box input:focus {
border-color: #00b894;
}

.chart-container {
background: white;
padding: 20px;
border-radius: 18px;
box-shadow: 0 5px 15px rgba(0,0,0,.06);
margin-top: 20px;
position: relative;
height: 420px;
width: 100%;
}

@media(max-width: 600px) {
  .header { padding-top: 70px; }
  .backup-actions { top: 15px; right: 15px; }
  .tabs { flex-direction: column; gap: 5px; }
  .topo { flex-wrap: wrap; gap: 10px; }
  .nome { width: 100%; }
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>💰 Controle Financeiro</h1>
<div class="backup-actions">
<button class="btn-backup" onclick="exportarDados()">📤 Exportar</button>
<button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 Importar</button>
<input type="file" id="importFile" style="display:none" accept=".json" onchange="importarDados(this)">
</div>
<div class="mes-seletor">
<button onclick="mudarMes(-1)">◀</button>
<span id="mesAtualLabel">Janeiro</span>
<button onclick="mudarMes(1)">▶</button>
</div>
<p>Salário do mês</p>
<input type="number" id="salario">
</div>

<!-- Abas de Navegação -->
<div class="tabs">
<button class="tab-btn active" onclick="switchTab('tab-mensal')">📅 Controle Mensal</button>
<button class="tab-btn" onclick="switchTab('tab-dashboard')">📊 Dashboard Histórico Geral</button>
</div>

<!-- Conteúdo Aba 1: Controle Mensal -->
<div id="tab-mensal" class="tab-content active">
<div class="cards">
<div class="card">
<h3>Saldo Remanescente</h3>
<div class="valor" id="saldo"></div>
</div>
<div class="card">
<h3>Total Gasto</h3>
<div class="valor" id="gasto"></div>
</div>
<div class="card">
<h3>Total Pago</h3>
<div class="valor" id="pago"></div>
</div>
<div class="card">
<h3>Utilizado</h3>
<div class="valor" id="percentual"></div>
</div>
</div>

<!-- Barra de Busca Mensal -->
<div class="search-box">
<label for="searchMensal">🔍 Pesquisar e Filtrar Gastos deste Mês:</label>
<input type="text" id="searchMensal" placeholder="Digite o nome do gasto para filtrar a lista e recalcular os totais acima..." oninput="atualizar()">
</div>

<h2>Meus Gastos do Mês</h2>
<div id="lista"></div>
<button class="add" onclick="novo()">+ Adicionar Gasto</button>
</div>

<!-- Conteúdo Aba 2: Dashboard -->
<div id="tab-dashboard" class="tab-content">
<div class="cards">
<div class="card">
<h3>Receita Acumulada (Tudo)</h3>
<div class="valor" id="receitaTotalGeral">R$ 0,00</div>
</div>
<div class="card">
<h3>Gasto Acumulado (Tudo)</h3>
<div class="valor" id="gastoTotalGeral">R$ 0,00</div>
</div>
<div class="card">
<h3>Saldo Geral Histórico</h3>
<div class="valor" id="saldoTotalGeral">R$ 0,00</div>
</div>
</div>

<div class="search-box">
<label for="searchChart">🔍 Pesquisar ou Filtrar Despesa Específica no Gráfico:</label>
<input type="text" id="searchChart" placeholder="Digite o nome do gasto (ex: Mercado, Aluguel...) ou deixe vazio para ver tudo" oninput="atualizarGrafico()">
</div>

<div class="chart-container">
<canvas id="canvasGrafico"></canvas>
</div>
</div>
</div>

<script>
let dataBase = new Date();
let anoAtual = dataBase.getFullYear();
let mesAtual = dataBase.getMonth();
let meuGrafico = null;

let dados = JSON.parse(localStorage.getItem("financeiro_parcelado")) || {
salarios: {}, 
gastos: [
{nome: "🏠 Aluguel", valor: 0, vezes: 12, startAno: anoAtual, startMes: mesAtual, pagos: {}},
{nome: "💡 Energia", valor: 0, vezes: 6, startAno: anoAtual, startMes: mesAtual, pagos: {}},
{nome: "🚿 Água", valor: 0, vezes: 1, startAno: anoAtual, startMes: mesAtual, pagos: {}},
{nome: "🌐 Internet", valor: 0, vezes: 1, startAno: anoAtual, startMes: mesAtual, pagos: {}},
{nome: "🛒 Mercado", valor: 0, vezes: 1, startAno: anoAtual, startMes: mesAtual, pagos: {}}
]
};

const salarioInput = document.getElementById("salario");

function obterSalarioMes() {
let chave = `${anoAtual}-${mesAtual}`;
return dados.salarios[chave] !== undefined ? dados.salarios[chave] : 0;
}

function definirSalarioMes(val) {
let chave = `${anoAtual}-${mesAtual}`;
dados.salarios[chave] = val;
}

function moeda(v){
return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function mudarMes(direcao) {
let novaData = new Date(anoAtual, mesAtual + direcao, 1);
anoAtual = novaData.getFullYear();
mesAtual = novaData.getMonth();
atualizar();
}

function salvar(){
definirSalarioMes(parseFloat(salarioInput.value) || 0);
localStorage.setItem("financeiro_parcelado", JSON.stringify(dados));
atualizar();
}

salarioInput.onchange = salvar;

function calcularDiferencaMeses(anoF, mesF, anoI, mesI) {
return (anoF - anoI) * 12 + (mesF - mesI);
}

function switchTab(tabId) {
document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

document.getElementById(tabId).classList.add('active');
event.currentTarget.classList.add('active');

if(tabId === 'tab-dashboard') {
atualizarGrafico();
atualizarStatsGerais();
}
}

function obterLinhaDoTempo(filtroTexto = "") {
let mesesSet = new Set();

Object.keys(dados.salarios).forEach(key => mesesSet.add(key));

dados.gastos.forEach(g => {
for (let i = 0; i < g.vezes; i++) {
let m = g.startMes + i;
let a = g.startAno + Math.floor(m / 12);
let mesMod = m % 12;
mesesSet.add(`${a}-${mesMod}`);
}
});

if (mesesSet.size === 0) {
mesesSet.add(`${anoAtual}-${mesAtual}`);
}

let mesesArray = Array.from(mesesSet).sort((a, b) => {
let [anoA, mesA] = a.split('-').map(Number);
let [anoB, mesB] = b.split('-').map(Number);
return (anoA * 12 + mesA) - (anoB * 12 + mesB);
});

let labels = [];
let datasetSalario = [];
let datasetGasto = [];

const mesesNomeCurto = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

mesesArray.forEach(chave => {
let [ano, mes] = chave.split('-').map(Number);
labels.push(`${mesesNomeCurto[mes]}/${ano}`);

let sal = dados.salarios[chave] !== undefined ? dados.salarios[chave] : 0;
datasetSalario.push(sal);

let totalGastoMes = 0;
dados.gastos.forEach(g => {
let mesesPassados = (ano - g.startAno) * 12 + (mes - g.startMes);
if (mesesPassados >= 0 && mesesPassados < g.vezes) {
if (!filtroTexto || g.nome.toLowerCase().includes(filtroTexto.toLowerCase())) {
totalGastoMes += Number(g.valor);
}
}
});
datasetGasto.push(totalGastoMes);
});

return { labels, datasetSalario, datasetGasto };
}

function atualizarGrafico() {
let filtro = document.getElementById("searchChart").value;
let dadosGrafico = obterLinhaDoTempo(filtro);

if (meuGrafico) {
meuGrafico.destroy();
}

let ctx = document.getElementById('canvasGrafico').getContext('2d');
meuGrafico = new Chart(ctx, {
type: 'bar',
data: {
labels: dadosGrafico.labels,
datasets: [
{
label: 'Salário / Receitas (R$)',
data: dadosGrafico.datasetSalario,
backgroundColor: 'rgba(0, 184, 148, 0.2)',
borderColor: 'rgba(0, 184, 148, 1)',
borderWidth: 2,
type: 'line',
tension: 0.2,
pointBackgroundColor: 'rgba(0, 184, 148, 1)'
},
{
label: filtro ? `Gasto Filtrado: "${filtro}" (R$)` : 'Total Gasto do Mês (R$)',
data: dadosGrafico.datasetGasto,
backgroundColor: 'rgba(231, 76, 60, 0.6)',
borderColor: 'rgba(231, 76, 60, 1)',
borderWidth: 1,
borderRadius: 5
}
]
},
options: {
responsive: true,
maintainAspectRatio: false,
scales: {
y: {
beginAtZero: true,
ticks: {
callback: function(value) {
return value.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}
}
}
},
plugins: {
tooltip: {
callbacks: {
label: function(context) {
let label = context.dataset.label || '';
if (label) label += ': ';
if (context.parsed.y !== null) {
label += context.parsed.y.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}
return label;
}
}
}
}
}
});
}

function atualizarStatsGerais() {
let dadosGrafico = obterLinhaDoTempo(""); 
let totalReceita = dadosGrafico.datasetSalario.reduce((a, b) => a + b, 0);
let totalGasto = dadosGrafico.datasetGasto.reduce((a, b) => a + b, 0);
let saldoGeral = totalReceita - totalGasto;

document.getElementById("receitaTotalGeral").innerHTML = moeda(totalReceita);
document.getElementById("gastoTotalGeral").innerHTML = moeda(totalGasto);
document.getElementById("saldoTotalGeral").innerHTML = moeda(saldoGeral);
document.getElementById("saldoTotalGeral").style.color = saldoGeral >= 0 ? "#27ae60" : "#e74c3c";
}

function atualizar(){
const mesesNome = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
document.getElementById("mesAtualLabel").innerText = `${mesesNome[mesAtual]} de ${anoAtual}`;

salarioInput.value = obterSalarioMes();

let lista = document.getElementById("lista");
lista.innerHTML = "";
let totalGasto = 0;
let totalPago = 0;
let salarioValor = obterSalarioMes();
let chaveMes = `${anoAtual}-${mesAtual}`;

let filtroMensal = document.getElementById("searchMensal") ? document.getElementById("searchMensal").value.toLowerCase() : "";

dados.gastos.forEach((g, i) => {
let mesesPassados = calcularDiferencaMeses(anoAtual, mesAtual, g.startAno, g.startMes);
let parcelaAtual = mesesPassados + 1;

if (mesesPassados < 0 || parcelaAtual > g.vezes) {
return; 
}

if (filtroMensal && !g.nome.toLowerCase().includes(filtroMensal)) {
return;
}

totalGasto += Number(g.valor);

// Verifica se está marcado como pago neste mês específico
if (!g.pagos) g.pagos = {};
let foiPago = g.pagos[chaveMes] === true;
if (foiPago) {
totalPago += Number(g.valor);
}

let p = 0;
if(salarioValor > 0) p = ((g.valor / salarioValor) * 100);

let cor = "#2ecc71";
if(p > 20) cor = "#f1c40f";
if(p > 40) cor = "#e74c3c";

lista.innerHTML += `
<div class="gasto ${foiPago ? 'gasto-pago' : ''}">
<div class="topo">
<input class="nome" data-index="${i}" data-campo="nome" value="${g.nome}" onchange="alterarNome(${i},this.value)">
<div style="display:flex; align-items:center; gap:12px;">
<label class="pago-container">
<input type="checkbox" ${foiPago ? 'checked' : ''} onchange="alterarStatusPago(${i}, this.checked)"> Pago
</label>
<div class="porcentagem">${p.toFixed(1)}%</div>
</div>
</div>
<div class="inputs-gasto">
<input class="valorInput" data-index="${i}" data-campo="valor" type="number" step="0.01" placeholder="Valor R$" value="${g.valor}" onchange="alterarValor(${i},this.value)">
<input class="vezesInput" data-index="${i}" data-campo="vezes" type="number" min="1" placeholder="Repetições (x)" value="${g.vezes}" onchange="alterarVezes(${i},this.value)">
</div>
<div class="barra">
<div class="preenchimento" style="width:${Math.min(p,100)}%;background:${cor};"></div>
</div>
<div class="footer">
<div class="valorTexto">
${moeda(Number(g.valor))}
<span class="parcela-tag">Mês ${parcelaAtual} de ${g.vezes}x (Restam ${g.vezes - parcelaAtual})</span>
</div>
<button class="excluir" onclick="remover(${i})">Excluir</button>
</div>
</div>
`;
});

let saldo = salarioValor - totalGasto;
let perc = 0;
if(salarioValor > 0) perc = (totalGasto / salarioValor) * 100;

document.getElementById("saldo").innerHTML = moeda(saldo);
document.getElementById("gasto").innerHTML = moeda(totalGasto);
document.getElementById("pago").innerHTML = moeda(totalPago);
document.getElementById("percentual").innerHTML = perc.toFixed(1) + "%";
document.getElementById("saldo").style.color = saldo >= 0 ? "#27ae60" : "#e74c3c";

localStorage.setItem("financeiro_parcelado", JSON.stringify(dados));

if(document.getElementById('tab-dashboard').classList.contains('active')) {
atualizarGrafico();
atualizarStatsGerais();
}
}

function alterarStatusPago(i, checked) {
let chaveMes = `${anoAtual}-${mesAtual}`;
if (!dados.gastos[i].pagos) {
dados.gastos[i].pagos = {};
}
if (checked) {
dados.gastos[i].pagos[chaveMes] = true;
} else {
dados.gastos[i].pagos[chaveMes] = false;
}
salvar();
}

function alterarNome(i, v){
dados.gastos[i].nome = v;
salvar();
}

function alterarValor(i, v){
dados.gastos[i].valor = parseFloat(v) || 0;
salvar();
}

function alterarVezes(i, v){
dados.gastos[i].vezes = parseInt(v) || 1;
salvar();
}

function remover(i){
dados.gastos.splice(i, 1);
salvar();
}

function novo(){
dados.gastos.push({
nome: "📝 Novo gasto",
valor: 0,
vezes: 1,
startAno: anoAtual,
startMes: mesAtual,
pagos: {}
});
salvar();
}

function exportarDados() {
let blob = new Blob([JSON.stringify(dados, null, 2)], {type: "application/json"});
let url = URL.createObjectURL(blob);
let downloadAnchor = document.createElement('a');
downloadAnchor.setAttribute("href", url);
downloadAnchor.setAttribute("download", "backup_controle_financeiro.json");
document.body.appendChild(downloadAnchor);
downloadAnchor.click();
document.body.removeChild(downloadAnchor);
URL.revokeObjectURL(url);
}

function importarDados(input) {
let file = input.files[0];
if (!file) return;

let reader = new FileReader();
reader.onload = function(e) {
try {
let dadosImportados = JSON.parse(e.target.result);
if (dadosImportados.gastos && dadosImportados.salarios) {
dados = dadosImportados;
localStorage.setItem("financeiro_parcelado", JSON.stringify(dados));
atualizar();
if(document.getElementById('tab-dashboard').classList.contains('active')) {
atualizarGrafico();
atualizarStatsGerais();
}
alert("Dados importados com sucesso!");
} else {
alert("Arquivo inválido. O formato dos dados não é compatível.");
}
} catch (err) {
alert("Erro ao ler o arquivo. Certifique-se de que é um arquivo .json válido.");
}
};
reader.readAsText(file);
input.value = ''; 
}

atualizar();
</script>
</body>
</html>
