<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Parcelado na Nuvem</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #eef3f8;
    padding: 25px;
}

.container {
    max-width: 950px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,.15);
    position: relative;
}

.titulo-container {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.status-nuvem {
    font-size: 14px;
    background: rgba(0, 0, 0, 0.1);
    padding: 4px 10px;
    border-radius: 20px;
}

.backup-actions {
    position: absolute;
    top: 25px;
    right: 25px;
    display: flex;
    gap: 10px;
}

.btn-backup {
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: 0.2s;
}

.btn-backup:hover {
    background: rgba(255, 255, 255, 0.3);
}

.mes-seletor {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    background: rgba(255, 255, 255, 0.2);
    padding: 10px 15px;
    border-radius: 10px;
    width: fit-content;
}

.mes-seletor button {
    background: white;
    color: #00b894;
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.mes-seletor span {
    font-size: 18px;
    font-weight: bold;
    text-transform: capitalize;
}

.header input {
    width: 250px;
    padding: 12px;
    font-size: 25px;
    border: none;
    border-radius: 10px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.card h3 {
    color: #888;
    margin-bottom: 10px;
}

.valor {
    font-size: 28px;
    font-weight: bold;
}

#saldo { color: #27ae60; }
#gasto { color: #e74c3c; }
#percentual { color: #3498db; }

h2 {
    margin: 30px 0 15px;
}

.gasto {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    transition: 0.3s;
    border-left: 5px solid transparent;
}

/* ESTILOS PARA GASTOS PAGOS */
.gasto.is-pago {
    border-left-color: #27ae60;
    background: #f4fdf8;
}

.gasto.is-pago .nome {
    text-decoration: line-through;
    color: #7f8c8d;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
}

.check-container {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: bold;
    color: #555;
    cursor: pointer;
}

.check-container input {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #27ae60;
}

.nome {
    flex: 1;
    font-size: 18px;
    font-weight: bold;
    padding: 8px;
    border: none;
    border-bottom: 2px solid #ddd;
    background: transparent;
}

.nome:focus {
    outline: none;
    border-color: #00b894;
}

.porcentagem {
    font-size: 18px;
    font-weight: bold;
    white-space: nowrap;
}

.inputs-gasto {
    display: flex;
    gap: 10px;
    margin: 12px 0;
}

.valorInput {
    flex: 2;
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: rgba(255,255,255,0.8);
}

.vezesInput {
    flex: 1;
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    border: 1px solid #ccc;
    text-align: center;
    background: rgba(255,255,255,0.8);
}

.barra {
    height: 18px;
    background: #eee;
    border-radius: 15px;
    overflow: hidden;
}

.preenchimento {
    height: 100%;
    width: 0%;
    transition: .3s;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
}

.valorTexto {
    font-size: 22px;
    font-weight: bold;
    color: #2d3436;
    display: flex;
    flex-direction: column;
}

.parcela-tag {
    font-size: 12px;
    color: #7f8c8d;
    font-weight: normal;
    margin-top: 2px;
}

.excluir {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
}

.add {
    width: 100%;
    padding: 18px;
    margin-top: 20px;
    font-size: 18px;
    background: #0984e3;
    color: white;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

.add:hover {
    background: #0676c8;
}

@media(max-width: 600px) {
    .header { padding-top: 80px; }
    .backup-actions { top: 20px; right: 20px; }
    .topo { flex-wrap: wrap; }
    .nome { width: 100%; order: 3; margin-top: 10px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="titulo-container">
            <h1>💰 Controle Financeiro</h1>
            <div class="status-nuvem" id="statusNuvem">⏳ Conectando...</div>
        </div>
        
        <div class="backup-actions">
            <button class="btn-backup" onclick="exportarDados()">📤 Exportar</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 Importar</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importarDados(this)">
        </div>

        <div class="mes-seletor">
            <button onclick="mudarMes(-1)">◀</button>
            <span id="mesAtualLabel">Carregando...</span>
            <button onclick="mudarMes(1)">▶</button>
        </div>
        <p>Salário do mês</p>
        <input type="number" id="salario">
    </div>
    <div class="cards">
        <div class="card">
            <h3>Saldo</h3>
            <div class="valor" id="saldo">R$ 0,00</div>
        </div>
        <div class="card">
            <h3>Total Gasto</h3>
            <div class="valor" id="gasto">R$ 0,00</div>
        </div>
        <div class="card">
            <h3>Utilizado</h3>
            <div class="valor" id="percentual">0%</div>
        </div>
    </div>
    <h2>Meus Gastos</h2>
    <div id="lista"></div>
    <button class="add" onclick="novo()">+ Adicionar Gasto</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvYi8dqXHfQaiBYOTyJB_5zcdrfIwtmr4",
        authDomain: "meu-controle-financeiro-73572.firebaseapp.com",
        databaseURL: "https://meu-controle-financeiro-73572-default-rtdb.firebaseio.com",
        projectId: "meu-controle-financeiro-73572",
        storageBucket: "meu-controle-financeiro-73572.firebasestorage.app",
        messagingSenderId: "637028969692",
        appId: "1:637028969692:web:1d6db2bd0120c8f6df1819"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'rainerwollace'); 

    let dataBase = new Date();
    let anoAtual = dataBase.getFullYear();
    let mesAtual = dataBase.getMonth();
    
    let dados = {
        salarios: {}, 
        gastos: []
    };

    const salarioInput = document.getElementById("salario");
    let primeiraCargaFeita = false;

    onValue(dbRef, (snapshot) => {
        const val = snapshot.val();
        if (val) {
            dados = val;
            if (!dados.gastos) dados.gastos = [];
            if (!dados.salarios) dados.salarios = {};
        } else if (!primeiraCargaFeita) {
            set(dbRef, dados);
        }
        
        primeiraCargaFeita = true;
        document.getElementById("statusNuvem").innerText = "☁️ Sincronizado";
        atualizar();
    });

    function salvarNuvem() {
        document.getElementById("statusNuvem").innerText = "🔄 Salvando...";
        definirSalarioMes(parseFloat(salarioInput.value) || 0);
        set(dbRef, dados).then(() => {
            document.getElementById("statusNuvem").innerText = "☁️ Sincronizado";
        });
    }

    salarioInput.addEventListener('input', salvarNuvem);

    function obterSalarioMes() {
        let chave = `${anoAtual}-${mesAtual}`;
        return dados.salarios[chave] !== undefined ? dados.salarios[chave] : 0;
    }

    function definirSalarioMes(val) {
        let chave = `${anoAtual}-${mesAtual}`;
        dados.salarios[chave] = val;
    }

    function moeda(v) {
        return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function calcularDiferencaMeses(anoF, mesF, anoI, mesI) {
        return (anoF - anoI) * 12 + (mesF - mesI);
    }

    function atualizar() {
        if (!primeiraCargaFeita) return; 

        const mesesNome = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
        document.getElementById("mesAtualLabel").innerText = `${mesesNome[mesAtual]} de ${anoAtual}`;

        if (document.activeElement !== salarioInput) {
            salarioInput.value = obterSalarioMes();
        }

        let lista = document.getElementById("lista");
        let focoIndex = null, focoCampo = null, selStart = null, selEnd = null;
        let ativo = document.activeElement;
        
        if (ativo && ativo.dataset && ativo.dataset.index !== undefined) {
            focoIndex = ativo.dataset.index;
            focoCampo = ativo.dataset.campo;
            selStart = ativo.selectionStart;
            selEnd = ativo.selectionEnd;
        }

        lista.innerHTML = "";
        let total = 0;
        let salarioValor = obterSalarioMes();
        let chaveMesAtual = `${anoAtual}-${mesAtual}`;

        dados.gastos.forEach((g, i) => {
            let mesesPassados = calcularDiferencaMeses(anoAtual, mesAtual, g.startAno, g.startMes);
            let parcelaAtual = mesesPassados + 1;

            if (mesesPassados < 0 || parcelaAtual > g.vezes) return; 

            total += Number(g.valor);
            let p = 0;
            if(salarioValor > 0) p = ((g.valor / salarioValor) * 100);

            let cor = "#2ecc71";
            if(p > 20) cor = "#f1c40f";
            if(p > 40) cor = "#e74c3c";

            // Verifica se este gasto está pago neste mês específico
            let isPago = g.pagos && g.pagos[chaveMesAtual] ? true : false;
            let classePago = isPago ? "is-pago" : "";

            lista.innerHTML += `
            <div class="gasto ${classePago}">
                <div class="topo">
                    <label class="check-container">
                        <input type="checkbox" onchange="marcarPago(${i}, this.checked)" ${isPago ? 'checked' : ''}>
                        Pago
                    </label>
                    <input class="nome" data-index="${i}" data-campo="nome" value="${g.nome}" oninput="alterarNome(${i},this.value)">
                    <div class="porcentagem">${p.toFixed(1)}%</div>
                </div>
                <div class="inputs-gasto">
                    <input class="valorInput" data-index="${i}" data-campo="valor" type="number" step="0.01" placeholder="Valor R$" value="${g.valor}" oninput="alterarValor(${i},this.value)">
                    <input class="vezesInput" data-index="${i}" data-campo="vezes" type="number" min="1" placeholder="Repetições (x)" value="${g.vezes}" oninput="alterarVezes(${i},this.value)">
                </div>
                <div class="barra">
                    <div class="preenchimento" style="width:${Math.min(p,100)}%;background:${cor};"></div>
                </div>
                <div class="footer">
                    <div class="valorTexto">
                        ${moeda(Number(g.valor))}
                        <span class="parcela-tag">Mês ${parcelaAtual} de ${g.vezes}x (Restam ${g.vezes - parcelaAtual})</span>
                    </div>
                    <button class="excluir" onclick="remover(${i})">Excluir</button>
                </div>
            </div>`;
        });

        let saldo = salarioValor - total;
        let perc = 0;
        if(salarioValor > 0) perc = (total / salarioValor) * 100;

        document.getElementById("saldo").innerHTML = moeda(saldo);
        document.getElementById("gasto").innerHTML = moeda(total);
        document.getElementById("percentual").innerHTML = perc.toFixed(1) + "%";
        document.getElementById("saldo").style.color = saldo >= 0 ? "#27ae60" : "#e74c3c";

        if (focoIndex !== null) {
            let seletor = `[data-index="${focoIndex}"][data-campo="${focoCampo}"]`;
            let campo = lista.querySelector(seletor);
            if (campo) {
                campo.focus();
                if (selStart !== null && campo.setSelectionRange) {
                    try { campo.setSelectionRange(selStart,selEnd); } catch(e){}
                }
            }
        }
    }

    // Função global para salvar status de pagamento do mês
    window.marcarPago = function(i, checked) {
        if (!dados.gastos[i].pagos) {
            dados.gastos[i].pagos = {};
        }
        let chaveMesAtual = `${anoAtual}-${mesAtual}`;
        dados.gastos[i].pagos[chaveMesAtual] = checked;
        salvarNuvem();
    };

    window.mudarMes = function(direcao) {
        let novaData = new Date(anoAtual, mesAtual + direcao, 1);
        anoAtual = novaData.getFullYear();
        mesAtual = novaData.getMonth();
        atualizar();
    };

    window.alterarNome = function(i, v) { dados.gastos[i].nome = v; salvarNuvem(); };
    window.alterarValor = function(i, v) { dados.gastos[i].valor = parseFloat(v) || 0; salvarNuvem(); };
    window.alterarVezes = function(i, v) { dados.gastos[i].vezes = parseInt(v) || 1; salvarNuvem(); };
    window.remover = function(i) { dados.gastos.splice(i, 1); salvarNuvem(); };

    window.novo = function() {
        dados.gastos.push({
            nome: "📝 Novo gasto",
            valor: 0,
            vezes: 1,
            startAno: anoAtual,
            startMes: mesAtual,
            pagos: {}
        });
        salvarNuvem();
    };

    window.exportarDados = function() {
        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dados, null, 2));
        let downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "backup_controle_financeiro.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    };

    window.importarDados = function(input) {
        let file = input.files[0];
        if (!file) return;
        
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let dadosImportados = JSON.parse(e.target.result);
                if (dadosImportados.gastos && dadosImportados.salarios) {
                    dados = dadosImportados;
                    salvarNuvem();
                    alert("Backup restaurado e sincronizado com a nuvem com sucesso!");
                } else {
                    alert("Arquivo inválido. O formato dos dados não é compatível.");
                }
            } catch (err) {
                alert("Erro ao ler o arquivo. Certifique-se de que é um arquivo .json válido.");
            }
        };
        reader.readAsText(file);
        input.value = ''; 
    };
</script>
</body>
</html>
