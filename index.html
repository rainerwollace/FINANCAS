<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Parcelado na Nuvem</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg-page:#F3F5F8;--surface-1:#FFFFFF;--surface-2:#F7F9FC;--border:#E4E8EF;--text-primary:#182437;--text-secondary:#64748B;--text-muted:#9AA5B4;--accent:#0B3D59;--accent-hover:#0E4E70;--accent-contrast:#FFFFFF;--highlight-bg:#FFF6E5;--highlight-text:#8A5A00;--danger-bg:#FDEDED;--danger-text:#B3261E;--danger-bar:#D64545;--success-bg:#E8F5EE;--success-text:#1F7A4D;--success-bar:#2F9E68;--warning-bg:#FFF6E5;--warning-text:#8A5A00;--warning-bar:#D98E04;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg-page:#0F1620;--surface-1:#1A2331;--surface-2:#212B3B;--border:#2B3648;--text-primary:#ECEFF4;--text-secondary:#96A0B2;--text-muted:#6C7789;--accent:#3FA9F5;--accent-hover:#62BAFA;--accent-contrast:#071620;--highlight-bg:#3A2C12;--highlight-text:#FFD98A;--danger-bg:#3A1E1E;--danger-text:#FF8A80;--danger-bar:#E36767;--success-bg:#163B2A;--success-text:#7FE0AD;--success-bar:#3EB27D;--warning-bg:#3A2C12;--warning-text:#FFD98A;--warning-bar:#E0A93A;color-scheme:dark}}
:root[data-theme="dark"]{--bg-page:#0F1620;--surface-1:#1A2331;--surface-2:#212B3B;--border:#2B3648;--text-primary:#ECEFF4;--text-secondary:#96A0B2;--text-muted:#6C7789;--accent:#3FA9F5;--accent-hover:#62BAFA;--accent-contrast:#071620;--highlight-bg:#3A2C12;--highlight-text:#FFD98A;--danger-bg:#3A1E1E;--danger-text:#FF8A80;--danger-bar:#E36767;--success-bg:#163B2A;--success-text:#7FE0AD;--success-bar:#3EB27D;--warning-bg:#3A2C12;--warning-text:#FFD98A;--warning-bar:#E0A93A;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif}
body{background:var(--bg-page);padding:20px;transition:background .2s}
.container{max-width:720px;margin:auto}
.header{background:var(--surface-1);border:.5px solid var(--border);padding:18px 20px;border-radius:18px}
.identidade{display:flex;justify-content:space-between;align-items:center;gap:10px}
.identidade h1{font-size:20px;font-weight:600;color:var(--text-primary)}
.header-acoes{display:flex;align-items:center;gap:8px;position:relative}
.status-nuvem{font-size:12px;color:var(--text-secondary);background:var(--surface-2);padding:4px 10px;border-radius:20px;white-space:nowrap}
.status-nuvem.erro{background:var(--danger-bg);color:var(--danger-text)}
.icon-btn{width:34px;height:34px;border-radius:10px;border:.5px solid var(--border);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--border)}
.menu-dropdown{position:absolute;top:42px;right:0;background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:none;flex-direction:column;min-width:180px;z-index:10}
.menu-dropdown.aberto{display:flex}
.menu-dropdown button{background:none;border:none;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--text-primary);cursor:pointer}
.menu-dropdown button:hover{background:var(--surface-2)}
.menu-dropdown .quem{padding:8px 12px;font-size:12px;color:var(--text-secondary);border-bottom:.5px solid var(--border);margin-bottom:4px;word-break:break-all}
.mes-seletor{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
.mes-seletor button{background:var(--surface-2);color:var(--text-primary);border:.5px solid var(--border);width:30px;height:30px;border-radius:50%;cursor:pointer;font-weight:bold}
.mes-seletor span{font-size:14px;font-weight:600;color:var(--text-secondary);text-transform:capitalize;min-width:140px;text-align:center}
.campo-salario{margin-top:16px}
.campo-salario label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:6px}
.header input[type="number"]{width:100%;padding:12px;font-size:20px;font-weight:600;border:.5px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text-primary)}
